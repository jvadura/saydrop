[package]
name = "saydrop"
version = "0.1.1"
edition = "2024"
description = "Dictate into any Windows app: press a hotkey, speak, and the text is pasted. Uses your own speech-to-text server."
license = "MIT"
repository = "https://github.com/jvadura/saydrop"
readme = "README.md"
keywords = ["dictation", "speech-to-text", "windows", "tray", "whisper"]
categories = ["accessibility", "multimedia::audio"]

[dependencies]
serde_json = "1"

[dependencies.windows-sys]
version = "0.61.2"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Media",
    "Win32_Media_Audio",
    "Win32_Networking_WinHttp",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[dev-dependencies]
# Only used by the test that writes assets/saydrop.ico.
png = "0.18.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[build-dependencies]
winresource = "0.1.34"
